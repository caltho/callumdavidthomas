<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <title>Callum David Thomas — DIY Sticker</title>
  <desc>Print at home. Cut along dashed line. Apply adhesive. Stick.</desc>

  <!-- white paper -->
  <rect width="800" height="240" fill="#ffffff"/>

  <!-- dashed cut line -->
  <rect x="10" y="10" width="780" height="220" rx="22"
        fill="none" stroke="#000000" stroke-width="2"
        stroke-dasharray="10 7"/>

  <!-- top-left meta -->
  <text x="32" y="42"
        font-family="ui-monospace, 'Courier New', monospace"
        font-size="12" font-weight="700" fill="#000000"
        letter-spacing="3">CDT — STICKER 001 / 001</text>

  <!-- top-right scissor hint -->
  <text x="768" y="42"
        font-family="ui-monospace, 'Courier New', monospace"
        font-size="12" fill="#000000" text-anchor="end"
        letter-spacing="3">✂  cut here</text>

  <!-- the name (centered) -->
  <text x="400" y="145"
        font-family="'Fraunces', 'Times New Roman', Georgia, serif"
        font-size="74" font-weight="700" fill="#000000"
        text-anchor="middle" letter-spacing="-2">Callum David Thomas</text>

  <!-- bottom-left -->
  <text x="32" y="218"
        font-family="ui-monospace, 'Courier New', monospace"
        font-size="11" fill="#000000"
        letter-spacing="2">PRINT · CUT · STICK</text>

  <!-- bottom-right -->
  <text x="768" y="218"
        font-family="ui-monospace, 'Courier New', monospace"
        font-size="11" fill="#000000" text-anchor="end"
        letter-spacing="2">callumdavidthomas.com</text>
</svg>
